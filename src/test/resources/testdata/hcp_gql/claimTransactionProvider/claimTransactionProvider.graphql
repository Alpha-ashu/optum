query claimTransactionProviders($query: ClaimTransactionProviderQuery)
{
    metadata: claimTransactionProvidersMetadata(query: $query)
    {
        totalCount
        page
        pageSize
    }
    claimTransactionProviders(query: $query)
    {
        claimTransactionIdentifier
        providerEntityRoleCode
        providerIdentifier
    }
}