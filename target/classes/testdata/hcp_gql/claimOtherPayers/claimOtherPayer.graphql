query getClaimOtherPayers($query: ClaimOtherPayerQuery) {
    claimOtherPayers(query: $query) {
        __typename
        claimTransactionIdentifier
        claimAdjudicationPlatformCode
        otherPayerClaimRowIdentifier
        otherPayerPrimaryIdentifierCode
        cobPayerPaidAmount
        cobCoveredAmount
        cobDiscountAmount
        cobAllowedAmount
        cobApprovedAmount
        otherPayerContactName
        cobPatientResponsibleAmount
        coordinationOfBenefitCoverageTypeCode
        coordinationOfBenefitInsuranceTypeCode
        coordinationOfBenefitInsuranceTypeDescription
        organizationName
        sourceSystemCode
        claimOtherPayerSubscriber {
            __typename
            subscriberMemberNumber
            subscriberInsuranceTypeCode
            subscriberPayerResponsibilitySequenceCode
        }
        audit {
            createDatetime
            updateDatetime
            recordStatusCode
        }
    }
}
